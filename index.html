<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ─────────────────────────────────────────────────────────
       Search / social metadata.
       English is the base language: the widest audience for a
       single set of og tags (one URL = one preview everywhere).
       The app itself still detects browser language and renders
       Korean, Japanese, etc. Only the preview is fixed.
       ───────────────────────────────────────────────────────── -->

  <title>TFT IQ — Korean Challenger Meta Quiz</title>
  <meta name="description" content="Learn the TFT meta from Korea's top 1500 players. Quiz yourself on core item builds, comps, and traits — every answer backed by average placement and sample size. Free, updated every patch." />

  <link rel="canonical" href="https://tft-iq-web.vercel.app/" />

  <!-- Open Graph — Reddit, Discord, Facebook, KakaoTalk -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TFT IQ" />
  <meta property="og:url" content="https://tft-iq-web.vercel.app/" />
  <meta property="og:title" content="TFT IQ — Korean Challenger Meta Quiz" />
  <meta property="og:description" content="Korean challengers built this. Can you name the third? Quiz yourself on the meta with real match data from Korea's top 1500." />
  <meta property="og:image" content="https://tft-iq-web.vercel.app/tft-iq-image-en.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Two core items and a question mark — TFT IQ, built on Korea top 1500 match data." />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TFT IQ — Korean Challenger Meta Quiz" />
  <meta name="twitter:description" content="Korean challengers built this. Can you name the third?" />
  <meta name="twitter:image" content="https://tft-iq-web.vercel.app/tft-iq-image-en.png" />

  <!-- Browser chrome color on mobile — matches the app background -->
  <meta name="theme-color" content="#0a0c13" />

  <!-- Keep whatever favicon lines you already have here -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- ── Keep your existing Vite entry / font links below ── -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
