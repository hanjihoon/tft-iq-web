<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TFT IQ — og:image (EN)</title>

<!-- Chakra Petch: cut-corner geometric display face, echoes the hex identity.
     Inter: neutral body face for English. Both CDN — capture while online. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:      #0a0c13;
    --bg2:     #151a2b;
    --card:    #1b2133;
    --line:    rgba(255,255,255,0.09);
    --text:    #eef1f7;
    --muted:   #7f889e;
    --gold:    #f6c652;
    --violet:  #8b6cff;
    --teal:    #3de0a8;

    --hex: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#000; }

  /* Capture target. Exactly 1200×630 */
  .frame{
    position:relative;
    width:1200px; height:630px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -20%, var(--bg2) 0%, var(--bg) 62%);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column;
    padding:44px 56px;
  }

  /* Hex board lattice — hints at the TFT board at very low contrast */
  .board{
    position:absolute; inset:-10% -5% auto -5%; height:120%;
    opacity:0.055; pointer-events:none;
    background-image:
      url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='104' viewBox='0 0 120 104'>\
<g fill='none' stroke='%23ffffff' stroke-width='2'>\
<path d='M30 2 L58 18 L58 50 L30 66 L2 50 L2 18 Z'/>\
<path d='M90 2 L118 18 L118 50 L90 66 L62 50 L62 18 Z'/>\
<path d='M60 54 L88 70 L88 102 L60 118 L32 102 L32 70 Z'/>\
</g></svg>");
    background-size:120px 104px;
    mask-image:linear-gradient(180deg, #000 0%, transparent 78%);
    -webkit-mask-image:linear-gradient(180deg, #000 0%, transparent 78%);
  }

  .top{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .mark{
    width:38px; height:38px; clip-path:var(--hex);
    background:linear-gradient(140deg, var(--violet), var(--gold));
  }
  .wordmark{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:27px; letter-spacing:0.05em;
  }
  .wordmark span{ color:var(--gold); }

  .source{
    font-family:'Chakra Petch', sans-serif;
    font-weight:600; font-size:14px; letter-spacing:0.16em;
    color:var(--gold);
    border:1px solid rgba(246,198,82,0.42);
    background:rgba(246,198,82,0.07);
    border-radius:999px; padding:9px 18px;
    white-space:nowrap;
  }

  .center{
    position:relative; z-index:1;
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:34px;
    margin-top:-6px;
  }

  .headline{
    text-align:center;
    font-weight:800; font-size:46px; line-height:1.22;
    letter-spacing:-0.025em;
  }
  .headline em{
    font-style:normal;
    color:var(--gold);
  }

  /* Hero: two cores revealed, third is the question — the product in one glance */
  .combo{ display:flex; align-items:center; gap:26px; }

  .slot{
    position:relative;
    width:104px; height:104px;
    display:grid; place-items:center;
  }
  .slot::before{
    content:''; position:absolute; inset:0;
    clip-path:var(--hex);
    background:var(--line);
  }
  .slot::after{
    content:''; position:absolute; inset:2px;
    clip-path:var(--hex);
    background:linear-gradient(160deg, var(--card), #10141f);
  }
  .slot img{
    position:relative; z-index:2;
    width:62px; height:62px; border-radius:12px;
  }

  .slot.ask::before{
    background:linear-gradient(140deg, var(--gold), rgba(246,198,82,0.25));
  }
  .slot.ask::after{
    background:linear-gradient(160deg, #221d10, #12141d);
  }
  .qmark{
    position:relative; z-index:2;
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:52px; color:var(--gold);
    line-height:1;
  }

  .plus{
    font-family:'Chakra Petch', sans-serif;
    font-size:26px; color:var(--muted); font-weight:600;
  }

  /* Average placement is this app's language — not win rate */
  .readout{
    display:flex; align-items:baseline; gap:12px;
    font-family:'Chakra Petch', sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .readout .label{
    font-size:15px; color:var(--muted);
    letter-spacing:0.14em; font-weight:600;
  }
  .readout .value{ font-size:34px; font-weight:700; color:var(--teal); }
  .readout .n{ font-size:16px; color:var(--muted); }

  .bottom{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    font-size:16.5px; color:var(--muted);
  }
  .bottom .dot{ color:rgba(255,255,255,0.22); margin:0 10px; }
  .url{
    font-family:'Chakra Petch', sans-serif;
    letter-spacing:0.05em; color:#9aa3b8;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="board"></div>

  <div class="top">
    <div class="brand">
      <div class="mark"></div>
      <div class="wordmark">TFT <span>IQ</span></div>
    </div>
    <div class="source">KOREA · TOP 1500</div>
  </div>

  <div class="center">
    <div class="headline">
      Korean challengers built this.<br>
      Can you <em>name the third</em>?
    </div>

    <div class="combo">
      <div class="slot">
        <img src="https://raw.communitydragon.org/latest/game/assets/maps/tft/icons/items/hexcore/tft_item_infinityedge.png" alt="">
      </div>
      <div class="plus">+</div>
      <div class="slot">
        <img src="https://raw.communitydragon.org/latest/game/assets/maps/tft/icons/items/hexcore/tft_item_madredsbloodrazor.png" alt="">
      </div>
      <div class="plus">+</div>
      <div class="slot ask">
        <div class="qmark">?</div>
      </div>
    </div>

    <div class="readout">
      <span class="label">AVG PLACE</span>
      <span class="value">3.72</span>
      <span class="n">· 2,119 games</span>
    </div>
  </div>

  <div class="bottom">
    <div>Real match data from Korea's top 1500<span class="dot">·</span>Updated every patch</div>
    <div class="url">tft-iq-web.vercel.app</div>
  </div>
</div>

</body>
</html>
